services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: live_in_hdu
      POSTGRES_USER: live_in_hdu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in an untracked deploy/local/.env.local file}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - "D:/Star/LIVE_IN_HDU_RUNTIME/postgres:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U live_in_hdu -d live_in_hdu"]
      interval: 10s
      timeout: 5s
      retries: 6

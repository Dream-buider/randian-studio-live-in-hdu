services:
  app:
    build:
      context: .
      dockerfile: ../../deploy/local/Dockerfile.weknora-app-runtime
    environment:
      SSRF_WHITELIST_EXTRA: tokendance.space
    ports: !override
      - "127.0.0.1:${APP_PORT:-8080}:8080"
  docreader:
    build:
      context: .
      dockerfile: ../../deploy/local/Dockerfile.weknora-docreader-runtime
  frontend:
    ports: !override
      - "127.0.0.1:${FRONTEND_PORT:-8081}:80"

name: ci

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm --prefix apps/freshman-mvp ci
      - run: npm run test:web
      - run: npm run build
      - run: npm --prefix apps/freshman-mvp run build:trial
